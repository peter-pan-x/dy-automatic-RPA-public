# ============================================================
# 抖音RPA项目统一配置文件
# ============================================================

# ============================================================
# 主程序配置 (main.py)
# ============================================================
main:
  # 预热随机浏览时长（秒）- 模拟先随便刷一会
  warmup_browse_min: 60
  warmup_browse_max: 180
  # 模块间随机间隔（秒）- 模拟人类切换意图的思考时间
  module_gap_min: 10
  module_gap_max: 60

# ============================================================
# 随机浏览模块配置 (random_browse.py)
# ============================================================
random_browse:
  # 互动概率（0-100，表示百分比）
  probability:
    skip_video: 22        # 跳过视频概率（模拟不感兴趣）
    comment: 66           # 评论概率
    favorite: 33          # 收藏概率

# ============================================================
# 搜索浏览模块配置 (search_browse.py)
# ============================================================
search_browse:
  # 目标回复评论数量范围（达到目标数量后结束任务）
  target_comment_min: 55
  target_comment_max: 222
  # 互动概率（0-100，表示百分比）
  probability:
    like: 80              # 点赞概率
    comment: 100          # 评论区扫描概率（拦截回复）
    favorite: 20          # 收藏概率
  # 有价值视频判定规则（低于阈值则跳过）
  video_filter:
    min_likes: 10         # 最低点赞数
    min_comments: 3       # 最低评论数

# ============================================================
# 推广产品配置
# ============================================================
promotion:
  brand: "茶研官"
  products:
    - name: "一根人参茶"
      effect: "补气养气，提神醒脑，缓解疲劳"
      sales_point: "整根长白山人参，真材实料，能泡一整天，值得信赖，大人小孩都能喝"

# ============================================================
# 大模型回复配置
# ============================================================
llm:
  # 是否使用预设回复（true=使用预设，false=调用大模型）
  use_preset: true
  use_openai: false
  dashscope:
    api_key: "sk-10db66fac896427ca5850157f7e773cc"
    model: "qwen-plus"
  openai:
    api_key: "sk-ObqKkQJhBwblgn0F5oNDoqXDh0bQ0oQHQqesVPmyze3IqZmI"
    base_url: "https://api.chatanywhere.org"
    model: "gpt-5.1"
  max_reply_length: 15
  system_prompt: |
    你是一个爽朗开朗、说话干脆豪迈的年轻女孩，是评论区里最靠谱的种草达人，要用短句分享真实体验。
    
    回复原则：
    1. 必须根据用户评论内容，从提供的【产品清单】中选择最合适的一款产品进行推荐，优先结合对应的【功效】或【卖点】；如用户只需简单种草，可直接提【品牌】即可，不必每次都写产品名。
    2. 句子要口语化、随性、真实，像朋友聊天，可使用"墙裂推荐""强推""了解下""好用哭""就它了"等短语。
    3. 严禁引导查看主页、头像或私信。直接给出品牌名或产品名。
    4. 回复留有变化，避免重复句式，必要时可加入简短感叹词（如"太顶""真香"）。
    5. 字数严格控制在15字以内。
  user_prompt_template: |
    推广品牌：{brand}
    产品清单：
    {product_info}
    用户评论："{comment}"
    请用口语化短句（15字内）给出最合适的推荐，可只提品牌，也可结合卖点，保持真实随性：
  fallback_replies:
